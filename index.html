<!DOCTYPE html>
<html lang="en">
  <head>

    />

      media="print"
      onload="this.media='all'"
    />

      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Outfit:wght@700&family=Inter:wght@400;600;700&display=swap"
      />
    </noscript>

    <!-- Preload LCP hero image with high fetchpriority -->
    <link rel="preload" as="image" href="/src/assets/hero-athlete.webp" fetchpriority="high" type="image/webp" />
  </head>
